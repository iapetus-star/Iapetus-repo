<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Imaginary Friend Became Famous</title>
  <style>
    body {
      background: linear-gradient(135deg, #f5e6ff, #dff4ff);
      font-family: 'Georgia', serif;
      color: #333;
      margin: 0;
      padding: 2rem;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
    }

    .container {
      background: #fff;
      border-radius: 16px;
      padding: 2rem;
      max-width: 800px;
      width: 100%;
      box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    }

    h1 {
      text-align: center;
      color: #7846a8;
      margin-bottom: 0.5rem;
    }

    .instructions {
      text-align: center;
      color: #777;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    label {
      font-weight: bold;
      color: #59436b;
      margin-bottom: -0.5rem;
    }

    input[type="text"] {
      padding: 0.8rem;
      font-size: 1rem;
      border-radius: 8px;
      border: 1px solid #d5c5e5;
      background: #fcfaff;
    }

    input:focus {
      outline: 2px solid #b88be0;
      border-color: transparent;
    }

    button {
      margin-top: 1rem;
      background: #7846a8;
      color: white;
      padding: 0.85rem;
      border: none;
      font-size: 1.1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #603587;
    }

    .story {
      background: #faf5ff;
      border-left: 5px solid #a56bd1;
      padding: 1.5rem;
      margin-top: 2rem;
      border-radius: 8px;
      line-height: 1.8;
      display: none;
    }

    .story h2 {
      color: #7846a8;
      margin-top: 0;
    }

    .story p {
      margin-bottom: 1rem;
    }

    #tryAgainBtn {
      display: none;
      width: 100%;
    }

    .footer {
      text-align: center;
      font-size: 0.85rem;
      color: #999;
      margin-top: 1.5rem;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>🌟 My Imaginary Friend Became Famous!</h1>

  <p class="instructions">
    Your imaginary friend is officially a celebrity! Fill in the blanks
    and discover what happens when their fame goes completely out of control.
  </p>

  <form id="madLibForm">
    <label for="friendName">Your imaginary friend's name</label>
    <input id="friendName" type="text" name="friendName"
      placeholder="e.g. Sir Pickles" required />

    <label for="adjective1">A ridiculous adjective</label>
    <input id="adjective1" type="text" name="adjective1"
      placeholder="e.g. sparkly" required />

    <label for="noun1">An unusual object</label>
    <input id="noun1" type="text" name="noun1"
      placeholder="e.g. rubber chicken" required />

    <label for="verb1">A verb ending in -ing</label>
    <input id="verb1" type="text" name="verb1"
      placeholder="e.g. breakdancing" required />

    <label for="celebrity">A type of celebrity</label>
    <input id="celebrity" type="text" name="celebrity"
      placeholder="e.g. pop star" required />

    <label for="place">A place</label>
    <input id="place" type="text" name="place"
      placeholder="e.g. the moon" required />

    <label for="food">A food</label>
    <input id="food" type="text" name="food"
      placeholder="e.g. spaghetti" required />

    <label for="emotion">An emotion</label>
    <input id="emotion" type="text" name="emotion"
      placeholder="e.g. embarrassment" required />

    <label for="sound">A funny sound</label>
    <input id="sound" type="text" name="sound"
      placeholder="e.g. HONK HONK!" required />

    <label for="verb2">A past-tense verb</label>
    <input id="verb2" type="text" name="verb2"
      placeholder="e.g. exploded" required />

    <button type="submit">✨ Make My Mad Lib!</button>
  </form>

  <div id="story" class="story" aria-live="polite"></div>
  <button id="tryAgainBtn">🔄 Create Another Story</button>

<script>
  const form = document.getElementById('madLibForm');
  const storyDiv = document.getElementById('story');
  const tryAgainBtn = document.getElementById('tryAgainBtn');

  form.addEventListener('submit', function(e) {
    e.preventDefault();

    const values = Object.fromEntries(
      new FormData(form).entries()
    );

    const story = generateStory(values);

    form.style.display = 'none';
    storyDiv.innerHTML = story;
    storyDiv.style.display = 'block';
    tryAgainBtn.style.display = 'block';
  });

  tryAgainBtn.addEventListener('click', () => {
    form.reset();
    form.style.display = 'flex';
    storyDiv.style.display = 'none';
    tryAgainBtn.style.display = 'none';
    form.querySelector('input').focus();
  });

  function generateStory(v) {
    const escapeHTML = (text) => String(text).replace(
      /[&<>"']/g,
      char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#39;'
      })[char]
    );

    const name = escapeHTML(v.friendName);
    const adjective = escapeHTML(v.adjective1);
    const noun = escapeHTML(v.noun1);
    const verb = escapeHTML(v.verb1);
    const celebrity = escapeHTML(v.celebrity);
    const place = escapeHTML(v.place);
    const food = escapeHTML(v.food);
    const emotion = escapeHTML(v.emotion);
    const sound = escapeHTML(v.sound);
    const verb2 = escapeHTML(v.verb2);

    return `
      <h2>📸 Breaking News: An Imaginary Legend!</h2>

      <p>
        It all started when my imaginary friend, <strong>${name}</strong>,
        a surprisingly ${adjective} individual, accidentally became famous
        after posting a video of themselves ${verb} with a ${noun}.
        Within five minutes, the video had twelve million views!
      </p>

      <p>
        Suddenly, everyone wanted a piece of ${name}. Famous ${celebrity}s
        begged for selfies, talk shows offered millions of dollars, and
        fans camped outside our house chanting, "${sound.toUpperCase()}!"
      </p>

      <p>
        Things got even crazier when ${name} announced a world tour
        starting in ${place}. Tickets sold out instantly, even though
        the only performance involved eating ${food} while standing
        on one foot.
      </p>

      <p>
        Meanwhile, I was feeling a strange mixture of ${emotion} and
        jealousy. This was MY imaginary friend! I had known ${name}
        since before they could even afford invisible sunglasses.
      </p>

      <p>
        At the biggest award show in history, ${name} walked onto the
        stage, tripped over absolutely nothing, and ${verb2} in front
        of the entire world.
      </p>

      <p>
        The crowd went wild. The internet went wilder. By morning,
        the incident had become the most popular meme on the planet.
      </p>

      <p>
        Eventually, I asked ${name}, "Don't you miss the good old days
        when nobody knew who you were?"
      </p>

      <p>
        ${name} put on their invisible sunglasses and replied,
        "Honestly? No. But I do miss having free time."
      </p>

      <p>
        And that's how my imaginary friend became the most famous
        person in the universe, while I became their unpaid personal
        assistant. At least I get free ${food}.
      </p>
    `;
  }
</script>

</body>
</html>
