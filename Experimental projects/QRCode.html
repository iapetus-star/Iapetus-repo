<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Code Generator</title>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#f3f4f6;
color:#111827;
transition:.3s;
}

body.dark{
background:#111827;
color:#f9fafb;
}

#app{
max-width:1200px;
margin:auto;
padding:20px;
}

header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
}

h1{
font-size:32px;
margin:0;
}

button{
border:0;
padding:10px 15px;
border-radius:8px;
cursor:pointer;
background:#2563eb;
color:white;
font-weight:bold;
transition:.2s;
}

button:hover{
opacity:.85;
}

#theme{
font-size:20px;
padding:8px 12px;
}

#wrap{
display:grid;
grid-template-columns:1fr 1fr;
gap:25px;
}

#controls,#preview{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 5px 20px #0002;
}

.dark #controls,.dark #preview{
background:#1f2937;
}

label{
display:block;
margin-top:12px;
margin-bottom:5px;
font-size:14px;
font-weight:bold;
}

input,select,textarea{
width:100%;
padding:10px;
border-radius:8px;
border:1px solid #d1d5db;
background:white;
color:#111827;
}

.dark input,.dark select,.dark textarea{
background:#374151;
color:white;
border-color:#4b5563;
}

textarea{
resize:vertical;
}

.group{
display:none;
}

.group.active{
display:block;
}

hr{
margin:20px 0;
border:0;
border-top:1px solid #ddd;
}

.dark hr{
border-color:#4b5563;
}

input[type=color]{
height:40px;
padding:2px;
}

input[type=checkbox]{
width:auto;
margin-right:5px;
}

input[type=range]{
padding:0;
}

#preview{
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
min-height:500px;
}

#qrWrap{
padding:20px;
background:white;
border-radius:12px;
}

.dark #qrWrap{
background:white;
}

#qr canvas,#qr svg{
max-width:100%;
height:auto;
}

#status{
margin-top:15px;
font-size:14px;
opacity:.7;
}

.buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:20px;
}

#downloadPNG{
background:#16a34a;
}

#downloadSVG{
background:#9333ea;
}

#copy{
background:#ea580c;
}

#clear{
background:#dc2626;
}

@media(max-width:800px){

#wrap{
grid-template-columns:1fr;
}

h1{
font-size:24px;
}

#preview{
min-height:350px;
}

}

@media(max-width:450px){

.buttons{
grid-template-columns:1fr;
}

#app{
padding:10px;
}

}

</style>

</head>
<body>

<div id="app">
<header>
<h1>QR Code Generator</h1>
<button id="theme" title="Toggle Dark Mode">🌙</button>
</header>

<div id="wrap">
<section id="controls">
<label>QR Type</label>
<select id="type">
<option value="text">Text</option>
<option value="url">URL</option>
<option value="wifi">WiFi</option>
<option value="email">Email</option>
<option value="phone">Phone</option>
<option value="sms">SMS</option>
<option value="vcard">vCard</option>
</select>

<div id="fields">
<div class="group" data-type="text">
<label>Text</label>
<textarea id="text" rows="5" placeholder="Enter text..."></textarea>
</div>

<div class="group" data-type="url">
<label>URL</label>
<input id="url" type="url" placeholder="https://example.com">
</div>

<div class="group" data-type="wifi">
<label>SSID</label>
<input id="ssid">
<label>Password</label>
<input id="wpass" type="password">
<label>Encryption</label>
<select id="enc">
<option>WPA</option>
<option>WEP</option>
<option>nopass</option>
</select>
<label>
<input id="hidden" type="checkbox">Hidden Network</label>
</div>

<div class="group" data-type="email">
<label>Email</label>
<input id="email" type="email">
<label>Subject</label>
<input id="subject">
<label>Message</label>
<textarea id="body" rows="4"></textarea>
</div>

<div class="group" data-type="phone">
<label>Phone Number</label>
<input id="phone">
</div>

<div class="group" data-type="sms">
<label>Phone Number</label>
<input id="smsnum">
<label>Message</label>
<textarea id="smsmsg" rows="4"></textarea>
</div>

<div class="group" data-type="vcard">
<label>Full Name</label>
<input id="vname">
<label>Company</label>
<input id="vcompany">
<label>Title</label>
<input id="vtitle">
<label>Phone</label>
<input id="vphone">
<label>Email</label>
<input id="vemail">
<label>Website</label>
<input id="vweb">
<label>Address</label>
<textarea id="vaddress" rows="3"></textarea>
</div>
</div>

<hr>

<label>Foreground</label>
<input id="fg" type="color" value="#000000">
<label>Background</label>
<input id="bg" type="color" value="#ffffff">
<label>
<input id="transparent" type="checkbox">Transparent Background</label>
<label>Size</label>
<input id="size" type="range" min="128" max="1024" step="32" value="300">
<span id="sizeVal">300 px</span>
<label>Margin</label>
<input id="margin" type="range" min="0" max="10" value="2">
<span id="marginVal">2</span>
<label>Error Correction</label>
<select id="ecc">
<option value="L">L (7%)</option>
<option value="M" selected>M (15%)</option>
<option value="Q">Q (25%)</option>
<option value="H">H (30%)</option>
</select>
<hr>

<label>Logo (Optional)</label>
<input id="logo" type="file" accept="image/*">
<label>Logo Size (%)</label>
<input id="logosize" type="range" min="5" max="40" value="20">
<span id="logoVal">20%</span>

<hr>

<div class="buttons">
<button id="downloadPNG">Download PNG</button>
<button id="downloadSVG">Download SVG</button>
<button id="copy">Copy Image</button>
<button id="clear">Clear</button>
</div>
</section>

<section id="preview">

<div id="qrWrap">
<div id="qr"></div>
</div>

<div id="status">Ready</div>
</section>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qr-code-styling@1.9.2/lib/qr-code-styling.js"></script>

<script>
const $ = id => document.getElementById(id);

const groups = document.querySelectorAll(".group");

let logo = null;

const qr = new QRCodeStyling({
    width: 300,
    height: 300,
    type: "canvas",
    data: "Hello QR!",
    margin: 2,
    qrOptions: {
        errorCorrectionLevel: "M"
    },
    dotsOptions: {
        color: "#000000",
        type: "square"
    },
    backgroundOptions: {
        color: "#ffffff"
    },
    imageOptions: {
        crossOrigin: "anonymous",
        margin: 5
    }
});

qr.append($("qr"));


function showFields() {
    const type = $("type").value;

    groups.forEach(group => {
        group.classList.toggle(
            "active",
            group.dataset.type === type
        );
    });
}

function escapeWifi(value) {
    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/;/g, "\\;")
        .replace(/,/g, "\\,")
        .replace(/:/g, "\\:");
}

function escapeVCard(value) {
    return String(value)
        .replace(/\\/g, "\\\\")
        .replace(/\n/g, "\\n")
        .replace(/,/g, "\\,")
        .replace(/;/g, "\\;");
}

function getData() {

    const type = $("type").value;

    switch (type) {

        case "text":
            return $("text").value.trim();


        case "url": {
            const url = $("url").value.trim();

            if (!url) {
                return "";
            }

            return url;
        }

        case "wifi": {
            const ssid = $("ssid").value;

            if (!ssid) {
                return "";
            }

            const encryption = $("enc").value;
            const password = $("wpass").value;
            const hidden = $("hidden").checked ? "true" : "false";

            return `WIFI:T:${encryption};S:${escapeWifi(ssid)};P:${escapeWifi(password)};H:${hidden};;`;
        }


        case "email": {
            const email = $("email").value.trim();

            if (!email) {
                return "";
            }

            const subject = $("subject").value;
            const body = $("body").value;

            let result = `mailto:${email}`;

            const params = [];

            if (subject) {
                params.push(`subject=${encodeURIComponent(subject)}`);
            }

            if (body) {
                params.push(`body=${encodeURIComponent(body)}`);
            }

            if (params.length) {
                result += "?" + params.join("&");
            }

            return result;
        }


        case "phone": {
            const phone = $("phone").value.trim();

            if (!phone) {
                return "";
            }

            return `tel:${phone}`;
        }


        case "sms": {
            const number = $("smsnum").value.trim();
            const message = $("smsmsg").value;

            if (!number) {
                return "";
            }

            return `sms:${number}${message ? "?body=" + encodeURIComponent(message) : ""}`;
        }


        case "vcard": {

            const name = $("vname").value.trim();

            if (!name) {
                return "";
            }

            return [
                "BEGIN:VCARD",
                "VERSION:3.0",
                `FN:${escapeVCard(name)}`,
                `ORG:${escapeVCard($("vcompany").value)}`,
                `TITLE:${escapeVCard($("vtitle").value)}`,
                `TEL:${escapeVCard($("vphone").value)}`,
                `EMAIL:${escapeVCard($("vemail").value)}`,
                `URL:${escapeVCard($("vweb").value)}`,
                `ADR:${escapeVCard($("vaddress").value)}`,
                "END:VCARD"
            ].join("\n");
        }


        default:
            return "";
    }
}

function update() {

    const qrData = getData();

    const size = Number($("size").value);
    const margin = Number($("margin").value);
    const logoSize = Number($("logosize").value);

    const foreground = $("fg").value;
    const background = $("transparent").checked
        ? "transparent"
        : $("bg").value;

    // Update displayed values 

    $("sizeVal").textContent = `${size} px`;
    $("marginVal").textContent = margin;
    $("logoVal").textContent = `${logoSize}%`;


    // Empty data 

    if (!qrData) {
        $("status").textContent = "Enter some data";

        qr.update({
            width: size,
            height: size,
            data: " ",
            margin: margin,

            qrOptions: {
                errorCorrectionLevel: $("ecc").value
            },

            dotsOptions: {
                color: foreground
            },

            backgroundOptions: {
                color: background
            },

            image: undefined,

            imageOptions: {
                crossOrigin: "anonymous",
                margin: 5,
                imageSize: logoSize / 100
            }
        });

        return;
    }


    qr.update({
        width: size,
        height: size,

        data: qrData,

        margin: margin,

        qrOptions: {
            errorCorrectionLevel: $("ecc").value
        },

        dotsOptions: {
            color: foreground,
            type: "square"
        },

        backgroundOptions: {
            color: background
        },

        image: logo || undefined,

        imageOptions: {
            crossOrigin: "anonymous",
            margin: 5,
            imageSize: logoSize / 100
        }
    });

    $("status").textContent = "Updated";
}

$("type").addEventListener("change", () => {
    showFields();
    update();
});


document.querySelectorAll("input, textarea, select").forEach(element => {

    element.addEventListener("input", update);

    element.addEventListener("change", update);

});

$("theme").addEventListener("click", () => {

    document.body.classList.toggle("dark");

    $("theme").textContent =
        document.body.classList.contains("dark")
            ? "☀️"
            : "🌙";
});

$("logo").addEventListener("change", event => {

    const file = event.target.files[0];

    if (!file) {
        logo = null;
        update();
        return;
    }

    if (!file.type.startsWith("image/")) {
        $("status").textContent = "Please select an image file";
        event.target.value = "";
        return;
    }

    const reader = new FileReader();

    reader.onload = () => {

        logo = reader.result;

        update();

        $("status").textContent = "Logo added";
    };

    reader.onerror = () => {
        $("status").textContent = "Could not load logo";
    };

    reader.readAsDataURL(file);
});


$("downloadPNG").addEventListener("click", async () => {

    try {

        await qr.download({
            name: "qrcode",
            extension: "png"
        });

        $("status").textContent = "PNG downloaded";

    } catch (error) {

        console.error(error);

        $("status").textContent = "PNG download failed";
    }
});

$("downloadSVG").addEventListener("click", async () => {

    try {

        await qr.download({
            name: "qrcode",
            extension: "svg"
        });

        $("status").textContent = "SVG downloaded";

    } catch (error) {

        console.error(error);

        $("status").textContent = "SVG download failed";
    }
});

$("copy").addEventListener("click", async () => {

    try {

        if (!navigator.clipboard || !window.ClipboardItem) {
            throw new Error("Clipboard API not supported");
        }

        const canvas = document.querySelector("#qr canvas");

        if (!canvas) {
            throw new Error("QR canvas not found");
        }

        const blob = await new Promise(resolve => {
            canvas.toBlob(resolve, "image/png");
        });

        if (!blob) {
            throw new Error("Could not create image");
        }

        await navigator.clipboard.write([
            new ClipboardItem({
                "image/png": blob
            })
        ]);

        $("status").textContent = "Copied";

    } catch (error) {

        console.error(error);

        $("status").textContent =
            "Copy failed — try using HTTPS or localhost";
    }
});

$("clear").addEventListener("click", () => {


    document.querySelectorAll(
        "input[type=text], input[type=url], input[type=email], input[type=password], textarea"
    ).forEach(element => {
        element.value = "";
    });


    $("fg").value = "#000000";
    $("bg").value = "#ffffff";


    $("size").value = 300;
    $("margin").value = 2;
    $("logosize").value = 20;


    $("type").value = "text";
    $("enc").value = "WPA";
    $("ecc").value = "M";


    $("hidden").checked = false;
    $("transparent").checked = false;


    $("logo").value = "";
    logo = null;


    showFields();
    update();

    $("status").textContent = "Cleared";
});

showFields();

update();
</script>
</body>
</html>
